# Production stack — file-size on iwebzone (behind edge-caddy).
# Requires .env next to this file. Do NOT `docker compose down -v` (deletes postgres_data).
name: file-size-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-file_size}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-file_size}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port: 127.0.0.1:5432 is already taken by honey-prod-db.

  app:
    build: .
    image: file-size:${IMAGE_TAG:-local}   # deploy.sh tags each build with the commit SHA, so old images stay available for rollback
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-file_size}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-file_size}
      SCREENSHOTONE_ACCESS_KEY: ${SCREENSHOTONE_ACCESS_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      # 그룹웨어 링크 인증. 두 비밀키가 없으면 모든 접속이 막힌다(scripts/groupware-link.mjs 참고).
      GROUPWARE_SSO_SECRET: ${GROUPWARE_SSO_SECRET:?GROUPWARE_SSO_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      GROUPWARE_URL: ${GROUPWARE_URL:-}
    volumes:
      - captures:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(() => process.exit(0)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      default:
      web:
        aliases: [file-size-app]

networks:
  web:
    external: true

volumes:
  postgres_data:
  captures:
